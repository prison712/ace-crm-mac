name: Build macOS client

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # 诊断：确认账户 Actions 是否还能拿到 runner
  smoke:
    runs-on: ubuntu-latest
    steps:
      - run: echo "ubuntu runner ok" && uname -a

  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run build

      # universal：一个安装包同时支持 Intel 和 Apple 芯片；原生模块按两种架构各编译一次
      - name: Package dmg + zip
        run: npx electron-builder --mac --universal --publish never -c.npmRebuild=true

      - name: Read version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v5
        with:
          name: ACE-CRM-mac-${{ steps.version.outputs.value }}
          if-no-files-found: error
          path: |
            desktop/dist/latest-mac.yml
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.blockmap
